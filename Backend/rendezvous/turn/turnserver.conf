# ReyDesk coturn config (T18 H2 hardening). Mounted read-only by the `turn`
# compose profile. The shared secret is NOT in this file: compose passes
# --static-auth-secret=$TURN_SECRET (same value as the rendezvous TURN_SECRET).
# Set realm and external-ip for the host:  --realm=turn.example --external-ip=PUBLIC_IP
#
# Never add allow-loopback-peers / --allow-loopback-peers (spike only) and never
# remove a denied-peer-ip line: they are what stops the relay from reaching the
# server's own network (TURN SSRF).

# --- auth: short-lived REST credentials from the rendezvous server ---
use-auth-secret
fingerprint
no-cli
no-tlsv1
no-tlsv1_1
no-software-attribute

# --- ports ---
listening-port=3478
min-port=49160
max-port=49200

# --- peers: deny every private, loopback, link-local and multicast range ---
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Docker bridge / compose networks of the host are inside 172.16.0.0/12 above.
# If your Docker uses another pool (default-address-pools), add it here.

# --- quotas: per credential and for the whole server ---
user-quota=4
total-quota=200
max-bps=1000000
bps-capacity=20000000
stale-nonce=600
